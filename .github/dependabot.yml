version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-and-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react", "@types/react-dom"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
