name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: No em or en dashes
        run: pnpm check:dashes
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Brand files are valid and meet WCAG 2.2 AA contrast
        run: pnpm brand:check config/brand.json config/brand-presets/*.json
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (includes the FairDraw draw port vectors and database fairness guards)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=moderate

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compose file is valid
        env:
          POSTGRES_PASSWORD: ci
          SITE_DOMAIN: localhost
          ACME_EMAIL: ci@example.com
        run: |
          touch .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev config --quiet
      - name: Caddyfile is valid
        run: docker run --rm -e SITE_DOMAIN=localhost -e ACME_EMAIL=ci@example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.6-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Image builds
        run: docker build --tag fairdraw-template-app:ci .
