# Serverless hosts only (docs/deploy-vercel.md): calls POST /api/cron/tick every 5 minutes, which closes competitions,
# makes due draws and settles payments. Docker installs run the worker service instead and do not need this.
# Set the repository variable TICK_URL (for example https://competitions.example.co.uk) and the secret CRON_SECRET
# (the same value as the site's CRON_SECRET). Without TICK_URL the job does nothing. Calling every 5 minutes keeps a
# free database that sleeps when idle (Neon Free) awake all month: on one of those use scripts/tick.sh instead.
name: Scheduled work (serverless)
# The schedule is off by default, so copies of the template that do not use it do not log a skipped run every 5
# minutes. To use it, remove the # from the two schedule lines below.
on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    if: ${{ vars.TICK_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run one cycle
        env:
          TICK_URL: ${{ vars.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # A block scalar: a plain YAML value cannot contain ": " (the header), which made this file invalid.
        run: |
          printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | curl -fsS --max-time 70 -X POST -H @- "$TICK_URL/api/cron/tick"
